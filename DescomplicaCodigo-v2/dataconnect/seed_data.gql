mutation SeedData @transaction {
  u1: user_insert(data: {email: "alice@example.com", displayName: "Alice", createdAt: "2023-01-01T00:00:00Z"})
  u2: user_insert(data: {email: "bob@example.com", displayName: "Bob", createdAt: "2023-01-02T00:00:00Z"})
  u3: user_insert(data: {email: "charlie@example.com", displayName: "Charlie", createdAt: "2023-01-03T00:00:00Z"})

  authMethod_insertMany(data: [
    {providerType: "google.com", providerId: "g1", user: {id_expr: "response.u1.id"}},
    {providerType: "google.com", providerId: "g2", user: {id_expr: "response.u2.id"}},
    {providerType: "github.com", providerId: "gh1", user: {id_expr: "response.u3.id"}}
  ])

  session_insertMany(data: [
    {deviceName: "MacBook", ipAddress: "192.168.1.1", lastUsedAt: "2023-10-01T12:00:00Z", user: {id_expr: "response.u1.id"}},
    {deviceName: "iPhone", ipAddress: "192.168.1.2", lastUsedAt: "2023-10-02T13:00:00Z", user: {id_expr: "response.u2.id"}},
    {deviceName: "Desktop", ipAddress: "192.168.1.3", lastUsedAt: "2023-10-03T14:00:00Z", user: {id_expr: "response.u3.id"}}
  ])

  userRole_insertMany(data: [
    {roleName: "admin", user: {id_expr: "response.u1.id"}},
    {roleName: "editor", user: {id_expr: "response.u2.id"}},
    {roleName: "viewer", user: {id_expr: "response.u3.id"}}
  ])

  securityLog_insertMany(data: [
    {eventType: "login", timestamp: "2023-10-01T12:00:00Z", ipAddress: "192.168.1.1", user: {id_expr: "response.u1.id"}},
    {eventType: "password_change", timestamp: "2023-10-02T13:00:00Z", ipAddress: "192.168.1.2", user: {id_expr: "response.u2.id"}},
    {eventType: "logout", timestamp: "2023-10-03T14:00:00Z", ipAddress: "192.168.1.3", user: {id_expr: "response.u3.id"}}
  ])
}